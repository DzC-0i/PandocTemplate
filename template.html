<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>$title$</title>
<style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#f3f6fa;color:#182635;font:16px/1.8 "Microsoft YaHei","Noto Sans CJK SC",sans-serif}
header{background:#163c57;color:white;padding:24px max(28px,calc((100vw - 1280px)/2));font-size:22px;font-weight:700}
header small{display:block;font-size:13px;font-weight:400;color:#c8dfec}
main{display:grid;grid-template-columns:240px minmax(0,1fr);gap:24px;max-width:1320px;margin:24px auto;padding:0 20px}
nav#TOC{position:sticky;top:20px;align-self:start;max-height:calc(100vh - 40px);overflow:auto;font-size:13px;background:white;border-radius:10px;padding:18px}
nav#TOC a{color:#285773;text-decoration:none}
nav#TOC ul{padding-left:18px;margin:0}
nav#TOC > ul{list-style:none;padding-left:0}
article{min-width:0;background:white;border:1px solid #e2e9ef;border-radius:12px;padding:32px 40px}
h1{font-size:28px;line-height:1.45;margin:0 0 18px}
h2{font-size:23px;border-bottom:2px solid #d7e7f0;padding-bottom:8px;margin-top:44px;scroll-margin-top:20px}
h3{font-size:19px;margin-top:30px}
p,li,td{overflow-wrap:anywhere}
p{margin:12px 0}
a{color:#12618b}
table{width:100%;border-collapse:collapse;font-size:14px;margin:18px 0}
th{background:#eaf2f7;text-align:left;color:#183f58}
th,td{border:1px solid #d7e2eb;padding:9px 12px;vertical-align:top}
tr:nth-child(even) td{background:#f8fafc}
code{font:13px/1.65 Consolas,"Noto Sans Mono CJK SC",monospace;background:#eef3f7;padding:2px 4px;border-radius:3px;overflow-wrap:anywhere}
pre{background:#112b3d;color:#e8f3fa;padding:18px;border-radius:8px;overflow-x:auto}
pre code{background:none;padding:0;color:inherit;white-space:pre;overflow-wrap:normal}
strong{color:#114e71}
button{border:0;border-radius:6px;padding:8px 14px;background:#e3f0f7;color:#163c57;cursor:pointer}
footer{padding:10px 28px 30px;text-align:center;color:#607688;font-size:13px}

blockquote, div.tip, div.note {
    margin: 18px 0; padding: 12px 18px;
    background-color: #fff8e6; border-left: 5px solid #f1c40f; border-radius: 0 8px 8px 0; color: #333;
}
div.warning { margin: 18px 0; padding: 12px 18px; background-color: #fdf2f2; border-left: 5px solid #e74c3c; border-radius: 0 8px 8px 0; }
div.info { margin: 18px 0; padding: 12px 18px; background-color: #eef7ff; border-left: 5px solid #3498db; border-radius: 0 8px 8px 0; }
blockquote p:first-child, div.tip p:first-child, div.warning p:first-child, div.info p:first-child { margin-top: 0; }
blockquote p:last-child, div.tip p:last-child, div.warning p:last-child, div.info p:last-child { margin-bottom: 0; }

img { max-width: 100%; height: auto; border-radius: 6px; display: block; margin: 16px 0; }
kbd { background: #f3f4f6; border: 1px solid #d1d5db; border-bottom-width: 2px; border-radius: 4px; padding: 2px 6px; font-family: Consolas, monospace; font-size: 13px; color: #374151; }
ul.task-list { list-style-type: none; padding-left: 0; }
ul.task-list input[type="checkbox"] { margin-right: 8px; vertical-align: middle; transform: scale(1.15); }
details { background: #f8fafc; border: 1px solid #d7e2eb; border-radius: 8px; padding: 10px 14px; margin: 16px 0; }
details summary { cursor: pointer; font-weight: bold; color: #114e71; user-select: none; }
details[open] summary { margin-bottom: 10px; border-bottom: 1px dashed #d7e2eb; padding-bottom: 8px; }
.footnotes {font-size: 14px;color: #607688;}
.footnotes ol {padding-left: 20px;}
thead { display: table-header-group; }

pre { position: relative; }
.copy-btn { position: absolute; top: 8px; right: 8px; padding: 4px 10px; background: rgba(255, 255, 255, 0.15); color: #c8dfec; border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 4px; font-size: 12px; cursor: pointer; transition: all 0.2s ease; opacity: 0; }
pre:hover .copy-btn { opacity: 1; }
.copy-btn:hover { background: rgba(255, 255, 255, 0.3); color: #fff; }
.copy-btn.copied { background: #2ecc71; color: white; border-color: #2ecc71; }

@media(max-width:900px){main{display:block}nav#TOC{position:static;max-height:220px;margin-bottom:20px}article{padding:22px}table{font-size:12px}th,td{padding:7px}}
@media print{body{background:white;font-size:10pt}header,nav#TOC,button,footer{display:none}main{display:block;margin:0;padding:0}article{border:0;padding:0}h2,h3{break-after:avoid}tr{break-inside:avoid}pre{white-space:pre-wrap;background:#edf3f7;color:#102c3e;break-inside:avoid}pre code{white-space:pre-wrap;color:inherit}a{color:inherit;text-decoration:none}h1{font-size:22pt}h2{font-size:16pt}table{font-size:9pt} .copy-btn { display: none !important; }}
$highlighting-css$
</style>
</head>
<body>
$if(title)$<header>$title$$if(subtitle)$<small>$subtitle$</small>$endif$</header>$endif$
<main>
<nav id="TOC"><button onclick="window.print()">打印／保存PDF</button>
$toc$
</nav>
<article>
$body$
</article>
</main>
$if(footer)$<footer>$footer$</footer>$endif$

<script>
document.addEventListener("DOMContentLoaded", function() {
    document.querySelectorAll("pre").forEach(function(pre) {
        let btn = document.createElement("button");
        btn.className = "copy-btn";
        btn.innerText = "复制";

        btn.addEventListener("click", function() {
            let codeEl = pre.querySelector("code") || pre;
            let textToCopy = codeEl.innerText;

            navigator.clipboard.writeText(textToCopy).then(function() {
                btn.innerText = "已复制!";
                btn.classList.add("copied");
                setTimeout(function() {
                    btn.innerText = "复制";
                    btn.classList.remove("copied");
                }, 2000);
            }).catch(function(err) {
                console.error("复制失败: ", err);
                btn.innerText = "复制失败";
            });
        });

        pre.appendChild(btn);
    });
});
</script>
</body>
</html>
